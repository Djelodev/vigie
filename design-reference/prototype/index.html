function navItem(n,mobile=false){return `<button class="${page===n[0]?'active':''}" ${page===n[0]?'aria-current="page"':''} onclick="go('${n[0]}')">${ico(n[1])}<span>${mobile&&n[0]==='profile'?'Profil':n[2]}</span></button>`}
function shell(content){return `<div class="shell"><aside class="side"><button class="brand" aria-label="Vigie, accueil du site" onclick="go('landing')">${logo()}</button><div><div class="eyebrow nav-label">Mon espace</div><nav class="nav" aria-label="Navigation principale">${nav.map(n=>navItem(n)).join('')}</nav></div><div class="side-note"><strong>${ico('spark')} Un pas à la fois.</strong><p>Tu n’as pas besoin de tout décider aujourd’hui. Vigi est là pour t’aider à y voir plus clair.</p></div><div class="side-footer">Prototype · Vigie V1<br>Le bon repère, au bon moment.</div></aside><div class="main"><header class="top"><button class="mobile-logo" aria-label="Accueil du site Vigie" onclick="go('landing')">${logo()}</button><div class="top-title">Mon espace / ${nav.find(n=>n[0]===page)?.[2]||'Accueil'}</div><div class="top-right"><span class="demo">MODE DÉMO</span><button class="icon-btn" aria-label="Voir les alertes" onclick="go('alerts')">${ico('bell')}</button><button class="avatar" aria-label="Mon profil" onclick="go('profile')">C</button></div></header><main class="content" id="main">${content}${footer()}</main></div><nav class="mobile-nav" aria-label="Navigation mobile">${nav.slice(0,5).map(n=>navItem(n,true)).join('')}</nav></div>`}
function dashboard(){return head('Mon espace étudiant','Salut Camille !','Voici les repères pour avancer sereinement dans ton orientation.',btn('Mes choix',"go('track')",'outline','arrow'))+`<section class="hero"><div><div class="eyebrow">Le bon repère, au bon moment.</div><h2>Ton avenir.<br>Tes choix. À ton rythme.</h2><p>Explore les formations, compare tes options et garde un œil sur les étapes qui comptent.</p>${btn('Explorer les formations',"go('explore')",'white','arrow')}</div>${portrait()}<span class="spark" aria-hidden="true">✦</span></section><div class="stats">${[['heart','',saved.length,'Formations suivies','track'],['compare','mint',selected.length,'À comparer','compare'],['bell','orange',read.filter(x=>!x).length,'Alertes à lire','alerts']].map(a=>`<button class="stat" onclick="go('${a[4]}')">${tile(a[0],a[1])}<div><span class="num">${a[2]}</span><span class="small muted">${a[3]}</span></div></button>`).join('')}</div><div class="two-col"><section class="panel"><div class="section-title"><h2>Mes prochaines étapes</h2>${btn('Voir tout',"go('track')",'text','arrow')}</div>${taskRows()}<div class="tip">${ico('info')}<p>Les échéances affichées sont des exemples, pas le calendrier officiel.</p></div></section><section class="panel"><div class="section-title"><h2>Mon avancée</h2><span class="status mint">À ton rythme</span></div><strong style="font-size:32px;color:var(--vigie-blue)">${tasks.filter(Boolean).length}/3</strong><p class="muted">étapes préparatoires terminées</p><div class="progress" role="progressbar" aria-label="Étapes préparatoires" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${tasks.filter(Boolean).length}"><span style="width:${tasks.filter(Boolean).length/3*100}%"></span></div><div class="tip"><img src="assets/vigi-portrait.webp" alt=""><p><strong>Un conseil de Vigi</strong><br>Compare les contenus des formations, pas seulement leurs chiffres.</p></div></section></div>`}
const taskLabels=['Explorer trois formations','Identifier mes critères','Préparer mes documents'];const taskNotes=['Découvre plusieurs options','Choisis ce qui compte pour toi','Liste les pièces dont tu auras besoin'];
function taskRows(){return taskLabels.map((t,i)=>`<label class="task"><input type="checkbox" ${tasks[i]?'checked':''} onchange="tasks[${i}]=this.checked;render()" style="width:22px;height:22px;accent-color:var(--vigie-blue);flex-shrink:0"><div class="task-text"><strong>${t}</strong><span class="small muted">${taskNotes[i]}</span></div><span class="status ${tasks[i]?'mint':'orange'}">${tasks[i]?'Terminé':'À faire'}</span></label>`).join('')}
function courseCard(c){return `<article class="course"><div class="course-top">${tile('grad',c.type==='BTS'?'orange':'')}<div><h3>${c.title}</h3><div class="meta">${c.school}</div></div><button class="icon-btn ${saved.includes(c.id)?'saved':''}" aria-label="${saved.includes(c.id)?'Retirer des':'Ajouter aux'} choix : ${c.title}" aria-pressed="${saved.includes(c.id)}" onclick="fav(${c.id})">${ico('heart')}</button></div><div class="line"><span class="muted small">${c.city} · ${c.duration}</span><span class="status">${c.type}</span></div><p class="small muted">${c.tags}</p><div><div class="line"><span class="small muted">Taux d’accès historique (2025, démo)</span><strong>${c.rate} %</strong></div><div class="progress"><span style="width:${c.rate}%"></span></div></div><div class="actions">${btn('Voir la fiche',`detail(${c.id})`)}${btn(selected.includes(c.id)?'✓ À comparer':'Comparer',`toggleCompare(${c.id})`,'secondary')}</div></article>`}
function results(){let list=courses.filter(c=>[c.title,c.school,c.city,c.tags].join(' ').toLowerCase().includes(query.toLowerCase())&&(!type||c.type===type)&&(!city||c.city===city));return `<div class="section-title"><strong>${list.length} formation${list.length!==1?'s':''} de démonstration</strong>${btn(`Comparer (${selected.length}/2)`,"go('compare')",'text','arrow')}</div><div class="course-grid">${list.length?list.map(courseCard).join(''):`<div class="panel empty">${tile('search')}<h3>Aucun résultat</h3><p class="muted">Essaie une autre recherche ou enlève un filtre.</p>${btn('Réinitialiser',"resetFilters()",'secondary')}</div>`}</div>`}
function filter(){query=document.getElementById('q').value;type=document.getElementById('type').value;city=document.getElementById('city').value;document.getElementById('results').innerHTML=results()}
function resetFilters(){query=type=city='';render()}
function escapeAttr(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function explore(){return head('Découvrir','Explore les formations','Recherche par domaine, type de diplôme ou ville.')+`<div class="filter-bar"><label class="field">${ico('search')}<input id="q" aria-label="Rechercher une formation" placeholder="Informatique, réseau, ville…" value="${escapeAttr(query)}" oninput="filter()"></label><label class="field"><select id="type" aria-label="Type de diplôme" onchange="filter()"><option value="">Tous les diplômes</option>${['BUT','Licence','BTS'].map(t=>`<option ${type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><select id="city" aria-label="Ville" onchange="filter()"><option value="">Toutes les villes</option>${['Paris','Lyon','Toulouse'].map(t=>`<option ${city===t?'selected':''}>${t}</option>`).join('')}</select></label>${btn('Réinitialiser','resetFilters()','outline','settings')}</div><div id="results">${results()}</div><div class="tip">${ico('info')}<p>Les taux sont des exemples historiques fictifs, pas une estimation de tes chances d’admission.</p></div>`}
function compare(){let list=selected.map(id=>courses.find(c=>c.id===id));return head('Comprendre','Compare tes options','Regarde les critères côte à côte, sans classement imposé.',btn('Ajouter une formation',"go('explore')",'outline','arrow'))+(list.length?`<div class="compare-grid">${list.map(c=>`<section class="panel"><div class="course-top">${tile('grad')}<div><h3>${c.title}</h3><div class="small muted">${c.school}</div></div><button class="icon-btn" aria-label="Retirer ${c.title} de la comparaison" onclick="toggleCompare(${c.id})">${ico('close')}</button></div><div class="metric"><span class="muted">Ville</span><strong>${c.city}</strong></div><div class="metric"><span class="muted">Durée</span><strong>${c.duration}</strong></div><div class="metric"><span class="muted">Diplôme</span><strong>${c.type}</strong></div><div class="metric"><span class="muted">Taux 2025 · démo</span><strong>${c.rate} %</strong></div><p class="muted small" style="margin-top:12px">${c.tags}</p></section>`).join('')}</div><section class="panel" style="margin-top:16px"><div class="section-title"><h2>Taux d’accès historique</h2><span class="status">Données fictives</span></div><p class="muted small">Échelle de 0 à 100 % · années 2023 à 2025</p><div class="legend">${list.map((c,i)=>`<span><i class="dot ${i?'alt':''}"></i>${c.title}</span>`).join('')}</div><div class="chart" role="img" aria-label="Taux d’accès historiques fictifs : ${list.map(c=>c.title+' : '+c.history.join(', ')+' pour cent').join(' ; ')}">${[0,1,2].map(y=>`<div class="bar-group">${list.map((c,i)=>`<div class="bar ${i?'alt':''}" style="height:${c.history[y]}%" title="${c.title} : ${c.history[y]} %"></div>`).join('')}</div>`).join('')}</div><div class="axis"><span>2023</span><span>2024</span><span>2025</span></div><div class="tip">${ico('info')}<p>Un taux historique ne prédit pas ton admission. Il ne tient pas compte de ton dossier individuel.</p></div></section>`:`<div class="panel empty">${tile('compare')}<h3>Choisis deux formations</h3><p>Ajoute-les depuis Explorer pour les comparer.</p>${btn('Explorer',"go('explore')")}</div>`)}
function track(){return head('Avancer','Mes choix','Retrouve les formations suivies et ta liste personnelle de préparation.')+`<div class="section-title"><h2>Mes formations enregistrées</h2><span class="status">${saved.length} choix</span></div><div class="course-grid">${saved.length?saved.map(id=>courseCard(courses.find(c=>c.id===id))).join(''):`<div class="panel empty">${tile('heart')}<h3>Pas encore de choix</h3><p>Ajoute les formations qui te plaisent.</p>${btn('Explorer',"go('explore')")}</div>`}</div><section class="panel" style="margin-top:20px"><div class="section-title"><h2>Ma liste de préparation</h2><span class="status mint">${tasks.filter(Boolean).length}/3</span></div>${taskRows()}<p class="muted small" style="margin-top:10px">Cette liste n’est pas synchronisée avec ton dossier Parcoursup.</p></section>`}
function alerts(){return head('Rester informé','Mes alertes','Retrouve les rappels et personnalise tes notifications.',btn('Tout marquer comme lu','read=[true,true];render();toast(\'Alertes mises à jour.\')','outline','check'))+`<div class="two-col"><section class="panel"><div class="section-title"><h2>Notifications</h2><span class="status">${read.filter(x=>!x).length} non lue(s)</span></div>${[['calendar','orange','Prépare tes documents','Pense à vérifier les pièces demandées dans chaque fiche officielle.','track'],['compass','mint','Découvre de nouvelles options','Explore les formations de démonstration en informatique.','explore']].map((a,i)=>`<div class="alert-card">${tile(a[0],a[1])}<div class="task-text"><div class="line"><strong>${a[2]}</strong> ${!read[i]?'<span class="status orange">Nouveau</span>':''}</div><p class="small muted">${a[3]}</p>${btn('Voir',`read[${i}]=true;go('${a[4]}')`,'text','arrow')}</div></div>`).join('')}</section><section class="panel"><h2 style="font-size:22px">Mes préférences</h2><p class="muted small" style="margin:8px 0">Paramètres simulés, aucun envoi réel.</p>${preferenceRows()}</section></div>`}
function preferenceRows(){return [['Rappels importants','Échéances et préparation'],['Nouveautés','Formations et conseils'],['Newsletter','Résumé par e-mail (simulation)']].map((a,i)=>`<label class="toggle"><input type="checkbox" ${prefs[i]?'checked':''} onchange="prefs[${i}]=this.checked;toast('Préférence mise à jour (démo).')"><div><strong>${a[0]}</strong><p class="small muted">${a[1]}</p></div></label>`).join('')}
function profile(){return head('Mon compte','Mon profil','Gère tes préférences et personnalise ton espace.')+`<div class="two-col"><section class="panel"><div class="course-top"><div class="avatar" style="display:grid;place-items:center">C</div><div><h3>Camille · profil fictif</h3><div class="muted small">Espace de démonstration</div></div></div><div class="metric"><span>Situation</span><strong>Lycéen·ne</strong></div><div class="metric"><span>Centre d’intérêt</span><strong>Informatique</strong></div><div class="metric"><span>Compte</span><strong>Non connecté</strong></div><p class="muted small" style="margin:16px 0">Aucune donnée personnelle réelle n’est collectée dans cette maquette.</p>${btn('Retour à l’accueil',"go('dashboard')",'secondary')}</section><section class="panel"><h2 style="font-size:22px">Mes notifications</h2>${preferenceRows()}</section></div>`}
function landing(){return `<div class="landing"><header class="landing-top"><button class="brand" style="margin:0" onclick="go('landing')" aria-label="Vigie">${logo()}</button>${btn('Découvrir mon espace',"go('dashboard')",'outline','arrow')}</header><main><div class="landing-hero"><section><div class="eyebrow">L’orientation, sans pression.</div><h1>Ton avenir.<br><span>Tes choix.</span><br>À ton rythme.</h1><p>Explore les formations, comprends les chiffres et avance avec les bons repères. Vigie t’aide à préparer tes choix d’orientation, sans décider à ta place.</p>${btn('Commencer à explorer',"go('dashboard')",'','arrow')}<p class="small" style="font-size:12px;margin-top:12px">Prototype gratuit · Assistant indépendant de Parcoursup</p></section><section class="landing-visual">${portrait()}<div class="panel"><div class="course-top">${tile('compass')}<div><h3>Un repère à chaque étape.</h3><p class="muted small">Vigi t’accompagne pour mieux comprendre tes options.</p></div></div><div class="tip">${ico('spark')}<p><strong>Le bon repère, au bon moment.</strong></p></div></div></section></div><section class="landing-features">${[['compass','Explorer','Trouve les formations qui te correspondent.'],['compare','Comprendre','Compare les critères qui comptent pour toi.'],['bell','Avancer','Organise tes choix et tes rappels.']].map((a,i)=>`<div class="panel">${tile(a[0],['','mint','orange'][i])}<h3>${a[1]}</h3><p class="muted">${a[2]}</p></div>`).join('')}</section><div style="max-width:1200px;margin:auto;padding:0 28px 28px">${footer()}</div></main></div>`}
function detail(id){let c=courses.find(c=>c.id===id);let m=document.createElement('div');m.id='modal';m.className='modal';m.innerHTML=`<section class="panel" role="dialog" aria-modal="true" aria-labelledby="detail-title"><div class="section-title"><span class="status">Fiche fictive</span><button class="icon-btn" id="close-modal" aria-label="Fermer" onclick="closeModal()">${ico('close')}</button></div><h2 id="detail-title">${c.title}</h2><p class="muted">${c.school} · ${c.city}</p><div class="metric"><span>Durée</span><strong>${c.duration}</strong></div><div class="metric"><span>Type</span><strong>${c.type}</strong></div><div class="metric"><span>Taux historique 2025</span><strong>${c.rate} % (démo)</strong></div><p>${c.tags}</p><p class="muted small">Cette fiche est un exemple. Consulte les données officielles avant toute décision.</p>${btn(saved.includes(id)?'Retirer de mes choix':'Ajouter à mes choix',`closeModal();fav(${id})`,'','heart')}</section>`;window.lastFocus=document.activeElement;document.body.appendChild(m);document.getElementById('close-modal').focus()}
function closeModal(){document.getElementById('modal')?.remove();window.lastFocus?.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&document.getElementById('modal')){let a=[...document.querySelectorAll('#modal button')];if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0].focus()}}});
function render(){let views={dashboard,explore,compare,track,alerts,profile};document.getElementById('app').innerHTML=page==='landing'?landing():shell(views[page]());document.title='Vigie — '+(nav.find(n=>n[0]===page)?.[2]||'Orientation')}
page=getPage();render();</script></body></html>
